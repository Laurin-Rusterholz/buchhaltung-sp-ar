<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vereinsbuchhaltung</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 id="brand">Buchhaltung</h1>
        <div id="brand-subtitle" class="muted small">Verein</div>
      </div>
      <nav id="nav">
        <a href="#dashboard" data-route="dashboard">Dashboard</a>
        <a href="#inbox" data-route="inbox">📥 Inbox</a>
        <a href="#buchungen" data-route="buchungen">Buchungen</a>
        <a href="#konten" data-route="konten">Kontenplan</a>
        <a href="#sektionen" data-route="sektionen">Sektionen</a>
        <a href="#rechnungen" data-route="rechnungen">Rechnungen</a>
        <a href="#belege" data-route="belege">Belege</a>
        <a href="#vorlagen" data-route="vorlagen">Vorlagen / Mails</a>
        <a href="#voranschlag" data-route="voranschlag">Voranschlag</a>
        <a href="#berichte" data-route="berichte">Berichte</a>
        <a href="#geschaeftsjahre" data-route="geschaeftsjahre">Geschäftsjahre</a>
        <a href="#einstellungen" data-route="einstellungen">Einstellungen</a>
      </nav>
      <div class="sidebar-footer">
        <label class="muted small" for="jahr-select">Geschäftsjahr</label>
        <select id="jahr-select"></select>
      </div>
    </aside>

    <main id="main">
      <div id="view" class="view">
        <div class="loader">Lädt…</div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Firebase SDK (Compat, da global verfügbar nötig für unsere ES-Module) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <!-- JSZip für Beleg-ZIP-Export -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
